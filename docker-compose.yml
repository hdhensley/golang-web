version: '3.9'

services:
  golang-web:
    image: ozp/golang-web
    depends_on:
      glw-mysql:
        condition: service_healthy
    build:
      context: .
    environment:
      - PORT=3000
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASS=password
      - DB_PORT=3307
      - DB_NAME=gorm_example
    ports:
      - "3000:3000"
  glw-mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=gorm_example
    ports:
      - "3307:3306"
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=password --execute \"SHOW DATABASES;\""
      interval: 2s
      timeout: 20s
      retries: 10